function getMode(){return $('mode').value}function getDuck(){let v=Number($('duck').value);return Number.isFinite(v)?Math.min(100,Math.max(0,v))/100:0.3}

door.addEventListener('pointerdown',e=>{e.preventDefault();if(doorHeld)return;if(!sounds.door.src){alert('先に設定から乗降終了合図を登録してください。');return}doorHeld=true;$('doorLamp').classList.add('lit');sounds.door.currentTime=0;door.setPointerCapture?.(e.pointerId);sounds.door.play().catch(()=>stopDoor())});for(const event of ['pointerup','pointercancel','lostpointercapture'])door.addEventListener(event,stopDoor);sounds.door.addEventListener('ended',stopDoor);window.addEventListener('blur',stopDoor);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopDoor()});
$('gear').onclick=()=>$('settings').classList.add('open');$('close').onclick=()=>$('settings').classList.remove('open');
})();
</script></body></html>
