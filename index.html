<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#292929"><title>新幹線駅員ごっこアプリ</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#292929;color:white;font-family:system-ui,sans-serif}button,input,select{font:inherit}.cabinet{width:min(82vw,360px);height:min(94dvh,1000px);min-height:580px;margin:3dvh auto;border:5px solid #050505;display:grid;grid-template-rows:17fr 21fr 21fr 21fr 20fr}.section{border-bottom:5px solid #050505;min-height:0;display:flex;align-items:center;justify-content:center}.section:last-child{border:0}.controls{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}.indicators{position:absolute;left:8%;display:flex;flex-direction:column;align-items:center;gap:10px}.rectangle{width:clamp(35px,11vw,70px);height:clamp(20px,5vw,34px);border:5px solid black;border-radius:4px;background:#444}.lamp{width:clamp(29px,8vw,43px);aspect-ratio:1;border:5px solid black;border-radius:50%;background:#bdbdbd;transition:background .12s,box-shadow .12s}.lamp.lit{background:#b5f34a;box-shadow:0 0 13px #b5f34a99}.ring{width:min(48%,18dvh,190px);aspect-ratio:1;border:7px solid black;border-radius:50%;background:#444;display:grid;place-items:center;position:absolute;left:61%;transform:translateX(-50%)}.bigbutton{width:78%;aspect-ratio:1;border:5px solid black;border-radius:50%;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}.blue{background:#0799f5}.red{background:#ef3438}.bigbutton:active{filter:brightness(1.1)}.settings-button{position:fixed;z-index:2;right:12px;top:max(12px,env(safe-area-inset-top));background:#444;color:white;border:2px solid black;border-radius:8px;padding:8px 12px;font-size:22px;cursor:pointer}.dialog{display:none;position:fixed;inset:0;z-index:5;background:#181818;padding:24px;overflow-y:auto}.dialog.open{display:block}.header{display:flex;align-items:center;justify-content:space-between;gap:12px}.header h2{margin:0}.close{padding:9px 14px;color:white;background:#444;border:1px solid #777;border-radius:7px;cursor:pointer}.setting{border-top:1px solid #444;margin-top:20px;padding-top:18px}.setting label{display:block;font-weight:600;margin-bottom:10px}.setting input[type=file]{max-width:100%;font-size:14px}.setting select,.setting input[type=number]{padding:9px;background:#333;color:white;border:1px solid #888;border-radius:6px}.setting input[type=number]{width:100px}.help{font-size:13px;color:#bbb;line-height:1.6}.status{font-size:12px;color:#b5f34a;overflow-wrap:anywhere}.hint{font-size:12px;color:#aaa;line-height:1.6;margin-top:20px}@media(max-width:380px){.cabinet{width:90vw}.ring{width:min(47%,18dvh)}.indicators{left:6%}}

/* Ver.5の操作盤寸法をモバイル表示時だけ適用 */
body.layout-mobile .cabinet {width:min(72vw,360px);height:1100px;min-height:0;margin:30px auto;grid-template-rows:180px 230px 230px 230px 220px}
body.layout-mobile .controls {position:static;display:flex;align-items:center;justify-content:center;gap:14px}
body.layout-mobile .indicators {position:static;left:auto;gap:10px}
body.layout-mobile .rectangle {width:54px;height:28px}
body.layout-mobile .lamp {width:38px;height:38px;aspect-ratio:1}
body.layout-mobile .ring {position:static;left:auto;transform:none;width:clamp(130px,38vw,190px);height:auto;aspect-ratio:1}
body.layout-mobile .bigbutton {width:76%}
@media(max-width:380px){body.layout-mobile .cabinet{width:82vw}body.layout-mobile .controls{gap:8px}body.layout-mobile .ring{width:37vw}body.layout-mobile .rectangle{width:44px}}
/* モバイルモードでもVer.5の縦長比率を維持する。横幅だけ狭い画面に合わせる */
@media(max-width:600px){
 body.layout-mobile .cabinet{width:min(78vw,calc(84dvh * .36));height:84dvh;min-height:0;margin:8dvh auto;grid-template-rows:17fr 21fr 21fr 21fr 20fr}
 body.layout-mobile .controls{gap:clamp(5px,2vw,12px)}
 body.layout-mobile .indicators{gap:clamp(5px,1.4dvh,10px)}
 body.layout-mobile .rectangle{width:clamp(30px,11vw,54px);height:clamp(18px,3.2dvh,28px);border-width:4px}
 body.layout-mobile .lamp{width:clamp(26px,4.3dvh,38px);height:auto;aspect-ratio:1;border-width:4px}
 body.layout-mobile .ring{width:min(54%,17dvh);height:auto;aspect-ratio:1;border-width:clamp(4px,.7dvh,7px)}
 body.layout-mobile .bigbutton{border-width:clamp(3px,.5dvh,5px)}
}


/* Ver.11: モバイルモードの設定画面を画面中央の適度な幅に収める */
body.layout-mobile .dialog {
  inset: max(4dvh, env(safe-area-inset-top)) auto auto 50%;
  transform: translateX(-50%);
  width: min(88vw, 420px);
  max-width: calc(100vw - 24px);
  max-height: 92dvh;
  padding: clamp(14px, 4vw, 22px);
  border: 2px solid #555;
  border-radius: 12px;
  box-shadow: 0 12px 40px #0009;
  overflow-x: hidden;
  overflow-y: auto;
}
body.layout-mobile .dialog .header {min-width:0;}
body.layout-mobile .dialog .header h2 {font-size:clamp(17px,5vw,22px);}
body.layout-mobile .dialog select,
body.layout-mobile .dialog input[type=file] {max-width:100%;min-width:0;}
body.layout-mobile .dialog select {width:100%;white-space:normal;}
</style></head><body>
<button class="settings-button" id="gear" aria-label="設定">⚙</button><main class="cabinet"><div class="section"></div><div class="section"><div class="controls"><div class="indicators"><div class="rectangle"></div><div class="lamp" id="bellLamp"></div></div><div class="ring"><button class="bigbutton blue" id="bellButton" aria-label="発車メロディ"></button></div></div></div><div class="section"><div class="controls"><div class="indicators"><div class="rectangle"></div><div class="lamp" id="doorLamp"></div></div><div class="ring"><button class="bigbutton red" id="doorButton" aria-label="乗降終了合図"></button></div></div></div><div class="section"></div><div class="section"></div></main>
<section class="dialog" id="settings"><div class="header"><h2>音声・モード設定</h2><button class="close" id="close">閉じる</button></div><div class="setting"><label for="layoutMode">表示モード</label><select id="layoutMode"><option value="auto">自動（画面幅で切り替え）</option><option value="pc">PC・iPadモード（Ver.4風）</option><option value="mobile">モバイルモード（Ver.5風）</option></select><p class="help">自動では画面幅600px以下をモバイル表示にします。手動選択も可能です。</p></div><div class="setting"><label for="mode">発車メロディのモード</label><select id="mode"><option value="normal">通常（停止までループ）</option><option value="tachikawa">立川式（停止操作後、現在のコーラス終わりで停止）</option></select></div><div class="setting"><label for="bellFile">発車メロディ</label><input type="file" id="bellFile" accept="audio/*,.mp3,.wav,.m4a,.ogg"><p class="status" id="bellStatus">未登録</p></div><div class="setting"><label for="announceFile">発車放送</label><input type="file" id="announceFile" accept="audio/*,.mp3,.wav,.m4a,.ogg"><p class="status" id="announceStatus">未登録</p></div><div class="setting"><label for="announceDelay">発車放送の開始タイミング（秒）</label><input type="number" id="announceDelay" min="0" max="3600" step="0.1" value="0" inputmode="decimal"> 秒<p class="help">発車メロディ開始から何秒後に発車放送を流すか設定します。0秒なら同時再生。メロディを停止しても予約された放送は再生されます。</p></div><div class="setting"><label for="duck">発車放送中のメロディ音量（%）</label><input type="number" id="duck" min="0" max="100" step="1" value="30" inputmode="numeric"> %<p class="help">0〜100の数字を入力。放送が終わると100%に戻ります。</p></div><div class="setting"><label for="doorFile">乗降終了合図</label><input type="file" id="doorFile" accept="audio/*,.mp3,.wav,.m4a,.ogg"><p class="status" id="doorStatus">未登録</p></div><p class="hint">設定と音声ファイルはこのブラウザに保存します。別の端末には自動で引き継がれません。ブラウザの保存データを消すと登録が失われる場合があります。</p></section>
<script>
(()=>{'use strict';
const layoutSelect=document.getElementById('layoutMode');
const mq=window.matchMedia('(max-width: 600px)');
function applyLayout(){const chosen=layoutSelect.value;document.body.classList.toggle('layout-mobile',chosen==='mobile'||(chosen==='auto'&&mq.matches));}
const savedLayout=localStorage.getItem('bell-layout-v6');if(['auto','pc','mobile'].includes(savedLayout))layoutSelect.value=savedLayout;
layoutSelect.addEventListener('change',()=>{localStorage.setItem('bell-layout-v6',layoutSelect.value);applyLayout()});
if(mq.addEventListener)mq.addEventListener('change',applyLayout);else mq.addListener(applyLayout);
applyLayout();
const $=id=>document.getElementById(id);const sounds={bell:new Audio(),announce:new Audio(),door:new Audio()};const urls={};let bellPlaying=false,doorHeld=false,starting=false,stopPending=false,activeMode="normal";let announcementTimer=null,announcementGeneration=0;
let audioContext=null,bellGain=null,announceBuffer=null,announceSource=null,announceStartAt=0,announceEndAt=0;
let announceLoadVersion=0;
function ensureAudioContext(){
  if(audioContext)return audioContext;
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass)return null;
  audioContext=new AudioContextClass();
  bellGain=audioContext.createGain();
  const bellNode=audioContext.createMediaElementSource(sounds.bell);
  bellNode.connect(bellGain).connect(audioContext.destination);
  return audioContext;
}
async function prepareAnnouncement(blob){
  const version=++announceLoadVersion;
  announceBuffer=null;
  if(!blob)return;
  try{
    const ctx=ensureAudioContext();
    if(!ctx)return;
    const bytes=await blob.arrayBuffer();
    const buffer=await ctx.decodeAudioData(bytes);
    if(version===announceLoadVersion)announceBuffer=buffer;
  }catch(e){console.warn('発車放送の音声デコードに失敗しました',e)}
}
function clearScheduledAnnouncement(){
  if(announcementTimer!==null){clearTimeout(announcementTimer);announcementTimer=null}
  ++announcementGeneration;
  if(announceSource){try{announceSource.stop()}catch(e){}announceSource.disconnect();announceSource=null}
  announceStartAt=0;announceEndAt=0;
}

function db(){return new Promise((resolve,reject)=>{const r=indexedDB.open('departure-bell-v3',1);r.onupgradeneeded=()=>r.result.createObjectStore('audio');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function storeFile(key,file){const d=await db();return new Promise((resolve,reject)=>{const t=d.transaction('audio','readwrite');t.objectStore('audio').put({blob:file,name:file.name},key);t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}
async function readFile(key){const d=await db();return new Promise((resolve,reject)=>{const r=d.transaction('audio','readonly').objectStore('audio').get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function setSource(key,blob,name){sounds[key].pause();if(urls[key])URL.revokeObjectURL(urls[key]);urls[key]=URL.createObjectURL(blob);sounds[key].src=urls[key];sounds[key].load();$(key+'Status').textContent='登録済み：'+name;if(key==='bell')endBell();if(key==='door')stopDoor();if(key==='announce'){clearScheduledAnnouncement();prepareAnnouncement(blob)}}
for(const key of ['bell','announce','door']){$(key+'File').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{await storeFile(key,file);setSource(key,file,file.name)}catch(err){alert('音声を保存できませんでした。容量などを確認してください。')}e.target.value=''})}
(async()=>{for(const key of ['bell','announce','door']){try{const f=await readFile(key);if(f)setSource(key,f.blob,f.name)}catch(e){}}})();
function getMode(){return $('mode').value}function getDuck(){let v=Number($('duck').value);return Number.isFinite(v)?Math.min(100,Math.max(0,v))/100:0.3}
function getDelay(){const v=Number($('announceDelay').value);return Number.isFinite(v)?Math.min(3600,Math.max(0,v)):0}
function playAnnouncement(){
  if(!sounds.announce.src||!sounds.announce.paused)return;
  try{sounds.announce.currentTime=0}catch(e){}
  sounds.announce.play().then(adjustVolume).catch(adjustVolume);
}
function scheduleAnnouncement(){
  clearScheduledAnnouncement();
  if(!sounds.announce.src)return;
  const delay=getDelay();
  const ctx=ensureAudioContext();
  if(ctx&&announceBuffer){
    // 青ボタンのタップ中に AudioContext を有効化し、音源の開始時刻を直接予約する。
    // setTimeout 内で play() しないため、iPhone の自動再生制限を回避しやすい。
    ctx.resume().catch(e=>console.warn('AudioContextを開始できません',e));
    const source=ctx.createBufferSource();
    source.buffer=announceBuffer;
    source.connect(ctx.destination);
    announceSource=source;
    announceStartAt=ctx.currentTime+delay;
    announceEndAt=announceStartAt+announceBuffer.duration;
    source.onended=()=>{
      if(announceSource!==source)return;
      announceSource=null;announceStartAt=0;announceEndAt=0;
      adjustVolume();
    };
    source.start(announceStartAt);
    adjustVolume();
    return;
  }
  // Web Audio 非対応やデコード失敗時のフォールバック（遅延再生は端末により制限あり）。
  const generation=announcementGeneration;
  if(delay===0){playAnnouncement();return}
  announcementTimer=setTimeout(()=>{announcementTimer=null;if(generation===announcementGeneration)playAnnouncement()},delay*1000);
}
function adjustVolume(){
  const webAnnouncementActive=!!(audioContext&&announceSource&&audioContext.currentTime>=announceStartAt&&audioContext.currentTime<announceEndAt);
  const htmlAnnouncementActive=!sounds.announce.paused&&!sounds.announce.ended;
  const target=(webAnnouncementActive||htmlAnnouncementActive)?getDuck():1;
  if(bellGain)bellGain.gain.value=target;
  else sounds.bell.volume=target;
}
// 放送開始時にメロディを減音。setTimeout は音声再生に使わず、音量変更だけに使う。
function queueVolumeChanges(){
  if(!audioContext||!announceSource)return;
  const source=announceSource;
  const wait=Math.max(0,(announceStartAt-audioContext.currentTime)*1000);
  setTimeout(()=>{if(announceSource===source)adjustVolume()},wait);
}
function endBell(){bellPlaying=false;starting=false;stopPending=false;sounds.bell.loop=false;$('bellLamp').classList.remove('lit')}
$('bellButton').addEventListener('click',()=>{if(starting)return;if(bellPlaying){if(activeMode==='tachikawa'){if(!stopPending){stopPending=true;sounds.bell.loop=false;}return;}sounds.bell.pause();sounds.bell.currentTime=0;endBell();return}if(!sounds.bell.src){alert('先に設定から発車メロディを登録してください。');return}starting=true;bellPlaying=true;stopPending=false;activeMode=getMode();$('bellLamp').classList.add('lit');sounds.bell.loop=true;sounds.bell.currentTime=0;
// 再生操作の同期処理中に両方のplay()を呼び、モバイルの自動再生制限に対応する。
const ctx=ensureAudioContext();if(ctx)ctx.resume().catch(()=>{});const p=sounds.bell.play();scheduleAnnouncement();adjustVolume();queueVolumeChanges();Promise.resolve(p).then(()=>{starting=false}).catch(()=>{sounds.bell.pause();endBell();alert('メロディを再生できませんでした。音声ファイルを確認してください。')})});
sounds.bell.addEventListener('ended',endBell);sounds.announce.addEventListener('play',adjustVolume);sounds.announce.addEventListener('pause',adjustVolume);sounds.announce.addEventListener('ended',adjustVolume);sounds.announce.addEventListener('error',adjustVolume);
$('announceDelay').addEventListener('change',()=>{const v=getDelay();$('announceDelay').value=String(v);localStorage.setItem('bell-announce-delay-v7',String(v))});$('duck').addEventListener('input',()=>{const v=Number($('duck').value);if(Number.isFinite(v)&&v>=0&&v<=100){localStorage.setItem('bell-duck-v3',String(v));adjustVolume()}});$('mode').addEventListener('change',()=>{localStorage.setItem('bell-mode-v3',getMode());/* 再生中のモードは次回の開始から反映 */});
const savedDelay=localStorage.getItem('bell-announce-delay-v7');if(savedDelay!==null&&Number.isFinite(Number(savedDelay))&&Number(savedDelay)>=0&&Number(savedDelay)<=3600)$('announceDelay').value=savedDelay;const savedMode=localStorage.getItem('bell-mode-v3');if(['normal','tachikawa'].includes(savedMode))$('mode').value=savedMode;const savedDuck=localStorage.getItem('bell-duck-v3');if(savedDuck!==null&&Number(savedDuck)>=0&&Number(savedDuck)<=100)$('duck').value=savedDuck;
const door=$('doorButton');function stopDoor(){doorHeld=false;sounds.door.pause();if(sounds.door.src)try{sounds.door.currentTime=0}catch(e){}$('doorLamp').classList.remove('lit')}
door.addEventListener('pointerdown',e=>{e.preventDefault();if(doorHeld)return;if(!sounds.door.src){alert('先に設定から乗降終了合図を登録してください。');return}doorHeld=true;$('doorLamp').classList.add('lit');sounds.door.currentTime=0;door.setPointerCapture?.(e.pointerId);sounds.door.play().catch(()=>stopDoor())});for(const event of ['pointerup','pointercancel','lostpointercapture'])door.addEventListener(event,stopDoor);sounds.door.addEventListener('ended',stopDoor);window.addEventListener('blur',stopDoor);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopDoor()});
$('gear').onclick=()=>$('settings').classList.add('open');$('close').onclick=()=>$('settings').classList.remove('open');
})();
</script></body></html>
